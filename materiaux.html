</style></head><body><div class="stage"><div id="ipad" class="ipad"><div id="verBadge" style="position:absolute;right:10px;bottom:8px;z-index:9998;pointer-events:none;background:rgba(255,255,255,.85);border:1px solid #dfe4e1;border-radius:999px;padding:3px 10px;font:11px -apple-system,Segoe UI,sans-serif;color:#173d2d"><b style="font-size:12px">Dimanche 11 h 32</b> <span style="opacity:.75">27 septembre 2026 · v2026-09-27-2</span></div><header class="top"><nav class="tnav"><a class="" href="./#cal" data-k="cal"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg><span>Calendrier</span></a><a class="" href="./feuille.html" data-k="fdt"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg><span>Feuille de temps</span></a><a class="" href="./#journal" data-k="jou"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="4" width="14" height="17" rx="2"/><path d="M9 3h6v3H9zM8.5 11h7M8.5 15h5"/></svg><span>Journal</span></a><a class="on" href="./#liv" data-k="liv"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2 7h11v9H2zM13 10h4l3 3v3h-7z"/><circle cx="6" cy="18" r="1.8"/><circle cx="16.5" cy="18" r="1.8"/></svg><span>Livraison</span></a><a class="" href="./echeancier.html" data-k="pla"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h9M7 11h10M10 16h10"/><path d="M3 3v18"/></svg><span>Planification</span></a><span class="tfill"></span><a class="" href="./#ph" data-k="pho"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg><span>Photos</span></a><a class="" href="./#prm" data-k="prm"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M4.2 4.2l2.1 2.1M17.7 17.7l2.1 2.1M2 12h3M19 12h3M4.2 19.8l2.1-2.1M17.7 6.3l2.1-2.1"/></svg><span>Paramètres</span></a></nav><button class="hnext" id="hnext" hidden>Continuer ›</button></header><div class="srow"><b id="tdate"></b><span>Livraison</span></div><div class="pbar" id="projBar"></div><iframe class="frame" src="./p_materiaux.html" title="Livraison"></iframe><div class="pgcode" id="pgCode"></div></div></div><script>
(function(){const K='journalChantier_v1';let S={};try{S=JSON.parse(localStorage.getItem(K))||{}}catch(e){}
  const ALL=["2565 Aird", "2575 Aird", "625 Place Théberge", "2020 St-Timothée", "3165 Holt"],P=ALL.filter(p=>!(S.off||{})['proj|'+p]).length?ALL.filter(p=>!(S.off||{})['proj|'+p]):ALL,bar=document.getElementById('projBar'),ONE=document.body.dataset.one==='1';
  if(ONE&&(S.viewAll||!P.includes(S.project))){S.viewAll=false;if(!P.includes(S.project))S.project=P[0]}
  function draw(){bar.style.setProperty('--n',P.length);bar.innerHTML=P.map(p=>'<button class="'+(!S.viewAll&&p===S.project?'on':'')+'" data-p="'+p+'">'+p+'</button>').join('')}
  const FDT=document.body.dataset.fdt==='1',fdt=()=>{try{const F=document.querySelector('.frame').contentWindow.fdt;return F&&F.page()==='projects'?F:null}catch(e){return null}};
  const nx=document.getElementById('hnext');nx.onclick=()=>{const F=fdt();if(F)F.next()};
  function syncF(){const F=FDT&&fdt();nx.hidden=!F;if(!F){if(bar.dataset.f){bar.dataset.f='';draw()}return}
    const A=F.added();bar.dataset.f='1';bar.innerHTML=P.map(p=>'<button class="'+(A.includes(p)?'on':'')+'" data-p="'+p+'">'+p+'</button>').join('');nx.textContent=F.nextLbl();nx.disabled=!F.nextOk()}
  if(FDT)setInterval(syncF,400);
  /* code de page (bas gauche) */
  const PCODE={pla:'PL1 · Planification',prm:'H1 · Aide',liv:'L1 · Livraison'},act=document.querySelector('.tnav a.on'),ak=act?act.dataset.k:'';
  const FW=document.getElementById('fweek');if(FW)FW.onclick=()=>{try{document.querySelector('.frame').contentWindow.fdt.week()}catch(e){}};
  function code(){let c=PCODE[ak]||'';try{const F=document.querySelector('.frame').contentWindow.fdt;if(FDT&&F){const pg=F.page();
      c=pg==='calendar'?'F1 · Feuille · calendrier':pg==='projects'?({1:'F2 · Feuille · projets',3:'F3 · Feuille · travailleurs',5:'F4 · Feuille · heures'})[F.step()]||'F2 · Feuille · jour':pg==='timesheet'?'F5 · Feuille · semaine':pg==='manage'?'F6 · Feuille · paramètres ('+({proj:'projets',act:'activités',emp:'employés',cal:'calendrier'})[F.mg()]+')':c;
      if(FW)FW.hidden=pg==='timesheet'}}catch(e){}
    document.getElementById('pgCode').textContent=c}
  setInterval(code,400);code();
  bar.onclick=e=>{const b=e.target.closest('[data-p]');if(!b)return;const p=b.dataset.p;
    const F=FDT&&fdt();if(F){F.toggle(p);syncF();return}
    if(!S.viewAll&&S.project===p){if(ONE)return;S.viewAll=true}else{S.viewAll=false;S.project=p}
    try{const T=JSON.parse(localStorage.getItem(K))||{};T.project=S.project;T.viewAll=S.viewAll;localStorage.setItem(K,JSON.stringify(T))}catch(e){}draw();const fr=document.querySelector('.frame');if(fr)try{fr.contentWindow.location.reload()}catch(e){}};
  draw();
  const fr0=document.querySelector('.frame');if(fr0&&location.search)fr0.src=fr0.getAttribute('src')+location.search;
  const D=['dim','lun','mar','mer','jeu','ven','sam'],M=['janv.','févr.','mars','avr.','mai','juin','juil.','août','sept.','oct.','nov.','déc.'],t=new Date();
  const DL=['Dimanche','Lundi','Mardi','Mercredi','Jeudi','Vendredi','Samedi'],ML=['janvier','février','mars','avril','mai','juin','juillet','août','septembre','octobre','novembre','décembre'];
  const td=document.getElementById('tdate');if(td)td.textContent=DL[t.getDay()]+' '+t.getDate()+' '+ML[t.getMonth()]+' '+t.getFullYear();
})();
</script></body>
<style>html.phone,html.phone body{background:#f3f5f4;overflow:hidden;height:100%}
html.phone .stage{padding:0!important;min-height:100%;align-items:center}

#zoomHint{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);background:rgba(23,61,45,.88);color:#fff;font:800 15px -apple-system,sans-serif;padding:10px 18px;border-radius:999px;z-index:9999;pointer-events:none;opacity:0;transition:opacity .25s}

<div id="safeProbe" style="position:fixed;left:0;top:0;width:0;height:0;visibility:hidden;pointer-events:none;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)"></div>
<script>
window.__fit=function(){const el=document.getElementById('ipad'),app=document.getElementById('app'),fdt=app&&!document.querySelector('.stage');if(!el&&!app)return;
  const cs=getComputedStyle(document.getElementById('safeProbe'));
  const L=parseFloat(cs.paddingLeft)||0,R=parseFloat(cs.paddingRight)||0,T=parseFloat(cs.paddingTop)||0,B=parseFloat(cs.paddingBottom)||0;
  const phone=Math.min(innerWidth,innerHeight)<600;document.documentElement.classList.toggle('phone',phone);
  if(!phone)window.__Z=1;const Z=window.__Z||1;document.documentElement.classList.toggle('zoomed',Z>1);
  const HH=document.querySelector('.apphdr')?(phone?35:58):0;
  const m=phone?0:8,s=Math.min(1,(innerWidth-L-R-m)/1180,(innerHeight-T-B-m-HH)/820)*Z;window.__S=s;
  if(fdt){
    if(phone){Object.assign(app.style,{width:'1180px',height:'820px',maxWidth:'none',minHeight:'0',padding:'0',overflow:'auto',zoom:s});if(el)el.style.zoom=1}
    else{Object.assign(app.style,{width:'',height:'',maxWidth:'',minHeight:'',padding:'',overflow:'',zoom:''});if(el)el.style.zoom=Math.min(1,(document.documentElement.clientWidth-8)/1180)}
  }else if(el)el.style.zoom=s;
  document.body.style.padding=phone?(T+'px '+R+'px '+B+'px '+L+'px'):'';};
function fitIpad(){window.__fit()}
addEventListener('resize',window.__fit);addEventListener('orientationchange',()=>setTimeout(window.__fit,200));
addEventListener('load',window.__fit);window.__fit();
(function(){let last=0,lx=0,ly=0;
  const SKIP='button,a,input,select,textarea,label,canvas,video,[data-v],[data-fa],[data-day],[data-proj],[data-proj2],[data-tn],[contenteditable]';
  function hint(t){let h=document.getElementById('zoomHint');if(!h){h=document.createElement('div');h.id='zoomHint';document.body.appendChild(h)}h.textContent=t;h.classList.add('on');clearTimeout(h._t);h._t=setTimeout(()=>h.classList.remove('on'),900)}
  function toggle(x,y){const box=(document.querySelector('.stage')?document.getElementById('ipad'):document.getElementById('app'))||document.getElementById('ipad');if(!box)return;
    const se=document.scrollingElement,r=box.getBoundingClientRect(),s0=window.__S;
    const cx=(x-r.left)/s0,cy=(y-r.top)/s0;
    window.__Z=(window.__Z||1)>1?1:2;window.__fit();
    if(window.__Z>1){const r2=box.getBoundingClientRect(),s1=window.__S;
      se.scrollLeft+=r2.left+cx*s1-x;se.scrollTop+=r2.top+cy*s1-y;hint('Zoom ×2 — double-tap pour revenir')}
    else{se.scrollLeft=0;se.scrollTop=0;hint('Vue complète')}}
  addEventListener('touchend',e=>{if(!document.documentElement.classList.contains('phone')||e.changedTouches.length!==1||e.touches.length)return;
    const t=e.changedTouches[0],now=Date.now();
    if(e.target.closest&&e.target.closest(SKIP)){last=0;return}
    if(now-last<320&&Math.abs(t.clientX-lx)<30&&Math.abs(t.clientY-ly)<30){e.preventDefault();last=0;toggle(t.clientX,t.clientY);return}
    last=now;lx=t.clientX;ly=t.clientY},{passive:false});
  addEventListener('dblclick',e=>{if(!document.documentElement.classList.contains('phone')||(e.target.closest&&e.target.closest(SKIP)))return;if('ontouchstart' in window)return;toggle(e.clientX,e.clientY)});
})();
</script>
