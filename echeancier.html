<script>
const D0=Date.UTC(2026,8,15),DAY=864e5;

function flow(items,x0,x1,y0,wf,step,mk){let cx=x0,cy=y0,out='';for(const it of items){const w=wf(it.l);if(cx+w>x1&&cx>x0){cx=x0;cy+=step}out+=mk(it,cx,cy,w);cx+=w+6}return{out,bottom:items.length?cy+step-6:y0}}
function chip(act,x,y,w,h,fs,l,f,s,t){return `<g class="chip"${act?` data-act="${act}" style="cursor:pointer"`:' pointer-events="none"'}><rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${w.toFixed(1)}" height="${h}" rx="${h/2}" fill="${f}" stroke="${s}" stroke-width="1"/><text x="${(x+w/2).toFixed(1)}" y="${(y+h/2+fs*0.36).toFixed(1)}" font-size="${fs}" text-anchor="middle" fill="${t}" pointer-events="none">${l}</text></g>`}
function actFull(t,x0,y0,P,on,draw){
  let y=y0+36,out='';const cf=on?'#FFFFFF':'#F1EFE8',cs=P.s!=='none'&&on?P.s:'none',ct=on?P.d:'#2C2C2A',lc=on?P.t:P.d;
  CATS.forEach(c=>{const L=t.res[c.k];if(!L.length)return;
    out+=`<text x="${x0+IP}" y="${y+10}" font-size="11" font-weight="500" fill="${lc}" pointer-events="none">${c.n}</text>`;y+=16;
    const f=flow(L.map((l,ix)=>({l,ix})),x0+IP,x0+SW-IP,y,cw,27,(it,cx,cy,w)=>chip(on?`rem:${c.k}:${it.ix}`:'',cx,cy,w,22,11,it.l,cf,cs,ct));

}
function actPreview(t,x0,y0){const all=[];CATS.forEach(c=>t.res[c.k].forEach(l=>all.push(l)));if(!all.length)return'';

function favs(i){const f={zo:[],st:[],ac:[],fo:[],ma:[]};
