.sup-row .n{font-weight:700;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.sup-row b{text-align:right;font-variant-numeric:tabular-nums}.sup-row b.zero{color:#b3bab6;font-weight:700}

/* nombre de travailleurs — one row per project that expands to the right */

.pl-head{display:flex;justify-content:space-between;align-items:baseline;gap:8px}.pl-name{font-weight:850;font-size:16px;line-height:1.2}.pl-total{font-size:12px;color:var(--muted);white-space:nowrap}.pl-total b{font-size:16px;color:var(--text);font-variant-numeric:tabular-nums;margin-right:2px}.pl-total.has b{color:var(--green-dark)}

.cnt-col{border:1px solid var(--line-soft);border-radius:11px;padding:8px;text-align:center}.cnt-col .t{font-size:12px;font-weight:800;color:var(--muted)}.cnt-col .v{font-size:22px;font-weight:900;font-variant-numeric:tabular-nums;margin:2px 0 6px}.cnt-col .v.zero{color:#b3bab6}
.cnt-btns{display:grid;grid-template-columns:1fr 1fr;gap:6px}.cbtn{height:36px;border:1px solid var(--line);background:var(--surface);border-radius:9px;font-size:19px;font-weight:900;line-height:1}.cbtn.plus{background:var(--green-soft);border-color:#b9ddc7;color:var(--green-dark)}.cbtn:disabled{opacity:.35;cursor:default}

/* v33 — Présélection (step 4) : colonnes serrées à gauche, tableau qui glisse */

.tbl[data-step="pre"] .prj>:nth-child(5),.tbl[data-step="pre"] .prj>:nth-child(8),.tbl[data-step="pre"] .prj>:nth-child(9),.tbl[data-step="pre"] .prj>:nth-child(10){display:none}

  else if(a==='favemp'){const e=state.empDb[Number(b.dataset.i)];if(!e.fav){if(!e.trade||e.trade==='Surintendant'){toast('Choisir le métier Menuisier ou Manœuvre');return}if(state.empDb.filter(x=>x.fav&&x.trade===e.trade).length>=12){toast('Favoris pleins (12)');return}}e.fav=!e.fav;save();renderManage()}
  else if(a==='empmod'){empEditing.add(state.empDb[Number(b.dataset.i)]);renderManage();const f=document.querySelector(`[data-emp="${b.dataset.i}"][data-f="name"]`);if(f)f.focus()}
  else if(a==='empok'){const i=Number(b.dataset.i),e=state.empDb[i];e.name=e.name.trim();e.company=(e.company||'').trim();empEditing.delete(e);if(!e.name&&!e.trade&&!e.company)state.empDb.splice(i,1);save();renderManage()}
  else if(a==='empmove'){const e=state.empDb[Number(b.dataset.i)];e.inactive=!e.inactive;save();renderManage();toast(`${e.name||'Employé'} → ${e.inactive?'Inactifs':'Actifs'}`)}
  else if(a==='delemp'){state.empDb.splice(Number(b.dataset.i),1);save();renderManage()}
  else if(a==='favact'){const t=b.dataset.t,v=b.dataset.v,i=state.actFav.findIndex(f=>f.t===t&&f.a===v);if(i>=0)state.actFav.splice(i,1);else if(state.actFav.filter(f=>f.t===t).length>=12)toast('Favoris pleins (12)');else state.actFav.push({t,a:v});save();renderManage()}
  else if(a==='favzone'){favToggle(zoneFavFor(state.mgProj),b.dataset.v);save();renderManage()}
  else if(a==='unfav'){const i=Number(b.dataset.i);if(b.dataset.kind==='act')state.actFav.splice(i,1);else zoneFavFor(state.mgProj).splice(i,1);save();renderManage()}
  else if(a==='proj'){zDraft=null;state.mgProj=b.dataset.p;save();renderManage()}
  else if(a==='zedit'){const rows=zoneRowsFor(state.mgProj);zDraft=rows.map(r=>{const n=Math.max(ZONE_COLS-(r.offset||0),r.items.length);return {group:r.group||'',offset:r.offset||0,cells:[...r.items,...Array(n-r.items.length).fill('')]}});renderManage();const f=document.querySelector('[data-er]');if(f)f.focus()}
  else if(a==='zsave'){if(zDraft)saveZoneDraft()}
  else if(a==='calprev'||a==='calnext'){mgMonth=new Date(mgMonth.getFullYear(),mgMonth.getMonth()+(a==='calprev'?-1:1),1);renderManage()}
  else if(a==='offpick'){offDraft=new Set(Object.keys(state.offDay).filter(k=>state.offDay[k]));renderManage()}
  else if(a==='offday'){const d=b.dataset.d;offDraft.has(d)?offDraft.delete(d):offDraft.add(d);renderManage()}
  else if(a==='offcancel'){offDraft=null;renderManage()}
  else if(a==='offsave'){state.offDay={};offDraft.forEach(d=>state.offDay[d]=true);offDraft=null;save();renderManage();toast('Journées non travaillées enregistrées')}
  else if(a==='zcancel'){zDraft=null;renderManage()}
  else if(a==='ztplsave'){state.zoneTemplate=JSON.parse(JSON.stringify(zoneRowsFor(state.mgProj)));save();renderManage();toast('Template enregistré')}
  else if(a==='ztpluse'){if(!state.zoneTemplate)return;const rows=zoneRowsFor(state.mgProj);const hasData=rows.some(r=>r.items.length||r.label);if(hasData&&!tplArm){tplArm=true;clearTimeout(tplTimer);tplTimer=setTimeout(()=>{tplArm=false;renderManage()},3000);renderManage();return}tplArm=false;state.zoneGrid[state.mgProj]=JSON.parse(JSON.stringify(state.zoneTemplate));const all=zoneListAll(state.mgProj),f=zoneFavFor(state.mgProj);for(let i=f.length-1;i>=0;i--)if(!all.includes(f[i]))f.splice(i,1);save();renderManage();toast('Template appliqué à '+state.mgProj)}
  else if(a==='zdel'){const r=zoneRowsFor(state.mgProj)[Number(b.dataset.r)],z=r.items[Number(b.dataset.i)];r.items.splice(Number(b.dataset.i),1);const f=zoneFavFor(state.mgProj),k=f.indexOf(z);if(k>=0)f.splice(k,1);save();renderManage()}
  else if(a==='zdelrow'){const rows=zoneRowsFor(state.mgProj),r=rows[Number(b.dataset.r)];const f=zoneFavFor(state.mgProj);r.items.forEach(z=>{const k=f.indexOf(z);if(k>=0)f.splice(k,1)});rows.splice(Number(b.dataset.r),1);save();renderManage()}
});
$('#managePage').addEventListener('change',e=>{const x=e.target;if(zDraft&&x.classList.contains('g-edit'))return;if(x.classList.contains('g-edit')){const rows=zoneRowsFor(state.mgProj),r=rows[Number(x.dataset.zr)],v=x.value.trim();if(!v&&x.dataset.zi!=null){x.value=r.items[Number(x.dataset.zi)];return}if(x.dataset.zi!=null){const i=Number(x.dataset.zi),old=r.items[i];if(old!==v){r.items[i]=v;renameZone(state.mgProj,old,v)}}else r.label=v;save();return}if(x.dataset.emp==null)return;const emp=state.empDb[Number(x.dataset.emp)];if(!emp)return;emp[x.dataset.f]=x.value.trim();save()});
function commitNew(x,refocus){const v=x.value.trim();if(!v||x.dataset.done)return;x.dataset.done='1';const k=x.dataset.gnew;Object.keys(state.zoneDraft).forEach(d=>{if(d.startsWith(state.mgProj+'|'))delete state.zoneDraft[d]});
  if(k==='act'){const tr=x.dataset.t;if(!activities(tr).includes(v))state.actList[tr].push(v)}
  else if(k==='zone'){const r=zoneRowsFor(state.mgProj)[Number(x.dataset.r)];if(r&&!r.items.includes(v))r.items.push(v)}
  else if(k==='row'){const rs=zoneRowsFor(state.mgProj);rs.push({group:(rs[rs.length-1]||{}).group,label:v,items:[]})}
  save();
  /* keep what is being typed in the other empty slots */
  const pending=[...document.querySelectorAll('#mgBody input.g-new')].filter(i=>i!==x&&i.value.trim()&&!i.dataset.done).map(i=>({k:i.dataset.gnew,r:i.dataset.r,t:i.dataset.t,v:i.value.trim()}));
  pending.forEach(pp=>{pp.done=true;if(pp.k==='zone'){const r=zoneRowsFor(state.mgProj)[Number(pp.r)];if(r&&!r.items.includes(pp.v))r.items.push(pp.v)}else if(pp.k==='act'){if(!activities(pp.t).includes(pp.v))state.actList[pp.t].push(pp.v)}else if(pp.k==='row'){zoneRowsFor(state.mgProj).push({label:pp.v,items:[]})}});
  save();renderManage();
  if(refocus){const sel=k==='act'?`[data-gnew="act"][data-t="${x.dataset.t}"]`:k==='zone'?`[data-gnew="zone"][data-r="${x.dataset.r}"]`:'[data-gnew="row"]';const again=document.querySelector(sel);if(again)again.focus()}
}
$('#managePage').addEventListener('keydown',e=>{const x=e.target;if(e.key==='Enter'&&x.dataset&&x.dataset.gnew){e.preventDefault();commitNew(x,true)}});
$('#managePage').addEventListener('change',e=>{const x=e.target;if(x.dataset&&x.dataset.gnew)commitNew(x,false)});
$('#managePage').addEventListener('input',e=>{const x=e.target;if(zDraft&&x.dataset.er!=null){zDraft[Number(x.dataset.er)].cells[Number(x.dataset.ec)]=x.value;return}if(zDraft&&x.dataset.eg!=null){const gi=Number(x.dataset.eg),og=zDraft[gi].group;for(let k=gi;k<zDraft.length&&(k===gi||zDraft[k].group===og);k++)zDraft[k].group=x.value;return}if(x.dataset.gnew==='zone'){const key=`${state.mgProj}|${x.dataset.r}|${x.dataset.slot}`;if(x.value.trim())state.zoneDraft[key]=x.value;else delete state.zoneDraft[key];save()}else if(x.dataset.emp!=null){const emp=state.empDb[Number(x.dataset.emp)];if(emp){emp[x.dataset.f]=x.value;save()}}});
document.querySelectorAll('[data-mg]').forEach(b=>b.onclick=()=>{state.mgMode=b.dataset.mg;go('manage')});

/* ===== statuts, approbation signée, calendrier et feuille de temps hebdomadaire ===== */
['approved','review','approvedAt','signed','offDay','weekApproved','weekSigned'].forEach(x=>state[x] ||= {});
const ST_LBL={vide:'Vide',cours:'En cours',appro:'En attente d’approbation',sign:'En attente de signature',done:'Complété',off:'Non travaillée'};
function dayStatus(ds){if(state.offDay[ds])return 'off';if(state.signed[ds])return 'done';if(state.approved[ds])return 'sign';if(state.review[ds])return 'appro';return dayHasData(ds)?'cours':'vide'}
function weekStatus(ws){if(state.weekSigned[ws])return 'done';if(state.weekApproved[ws])return 'sign';const [y,m,d]=ws.split('-').map(Number),s0=new Date(y,m-1,d);const st=[...Array(7)].map((_,i)=>dayStatus(fmt(addDays(s0,i)))).filter(x=>x!=='vide'&&x!=='off');if(!st.length)return 'vide';return st.every(x=>x==='done')?'appro':'cours'}
const fmtStamp=t=>{const d=new Date(t);return `${d.getDate()} ${monthNames[d.getMonth()]} ${d.getFullYear()} à ${String(d.getHours()).padStart(2,'0')} h ${String(d.getMinutes()).padStart(2,'0')}`};
/* flash « photo » */
function flash(){if(reduceMotion())return;const f=document.createElement('div');f.className='cam-flash';document.body.appendChild(f);setTimeout(()=>f.remove(),900)}
/* signature à la main */
function mountSigs(){document.querySelectorAll('canvas.sig:not([data-m])').forEach(cv=>{cv.dataset.m='1';const r=cv.getBoundingClientRect();const dpr=window.devicePixelRatio||1;cv.width=Math.max(300,Math.round(cv.offsetWidth*dpr));cv.height=Math.round(cv.offsetHeight*dpr);const ctx=cv.getContext('2d');ctx.lineWidth=2.2*dpr;ctx.lineCap='round';ctx.lineJoin='round';ctx.strokeStyle='#111';let down=false,last=null;
  const pt=e=>{const b=cv.getBoundingClientRect();return [(e.clientX-b.left)*cv.width/b.width,(e.clientY-b.top)*cv.height/b.height]};
  cv.onpointerdown=e=>{down=true;last=pt(e);cv.setPointerCapture(e.pointerId);cv.dataset.ink='1';cv.closest('.sig-wrap')?.classList.add('inked')};
  cv.onpointermove=e=>{if(!down)return;const p=pt(e);ctx.beginPath();ctx.moveTo(last[0],last[1]);ctx.lineTo(p[0],p[1]);ctx.stroke();last=p};
  cv.onpointerup=cv.onpointercancel=()=>{down=false}})}
function clearSig(id){const cv=document.getElementById(id);if(!cv)return;cv.getContext('2d').clearRect(0,0,cv.width,cv.height);delete cv.dataset.ink;cv.closest('.sig-wrap')?.classList.remove('inked')}
function readSig(id){const cv=document.getElementById(id);return cv&&cv.dataset.ink?cv.toDataURL('image/png'):null}
function sigBlock(id,signed,label){return signed?`<div class="sig-done"><div class="sig-lbl">${label}</div><img src="${signed.sig}" alt="Signature"><div class="sig-at">Complété le ${fmtStamp(signed.at)}</div></div>`:`<div class="sig-wrap"><div class="sig-lbl">${label}</div><canvas id="${id}" class="sig" aria-label="Zone de signature"></canvas><div class="sig-hint">Signer ici avec le doigt ou le crayon</div><button class="sig-clear" data-sigclear="${id}">Effacer</button></div>`}
document.addEventListener('click',e=>{const b=e.target.closest('[data-sigclear]');if(b)clearSig(b.dataset.sigclear)});

/* calendrier */
function renderCalendar(){
  const cal=$('#calendar');cal.innerHTML='';$('#monthTitle').textContent=`${monthNames[state.viewAnchor.getMonth()]} ${state.viewAnchor.getFullYear()}`;
  weekdays.forEach((w,i)=>{const c=document.createElement('div');c.className='cell weekday'+((i===0||i===6)?' weekend':'');c.textContent=w;cal.appendChild(c)});
  const start=calendarStart(state.viewAnchor),cw=startOfWeek(today);const wl=$('#weekList');if(wl)wl.innerHTML='';
  for(let i=0;i<42;i++){
    const d=addDays(start,i),ds=fmt(d),ws=fmt(startOfWeek(d)),wkDone=weekStatus(ws)==='done',st=dayStatus(ds),b=document.createElement('div'),weekend=[0,6].includes(d.getDay());
    b.className='cell day'+(weekend?' weekend':'')+(d.getMonth()!==state.viewAnchor.getMonth()?' other-month':'')+(d>=cw&&d<=addDays(cw,6)?' current-week':'')+(wkDone?' wk-done':'');
    b.setAttribute('role','button');b.tabIndex=0;b.setAttribute('aria-label',`${d.getDate()} ${monthNames[d.getMonth()]} — ${ST_LBL[st]}`);
    b.innerHTML=`<span class="day-tag st-${st} ${sameDay(d,today)?'is-today':''} ${state.selectedDate===ds?'is-sel':''}"><b class="dn">${d.getDate()}</b>${st!=='vide'?`<small>${ST_LBL[st]}</small>`:''}</span>`;
    const open=()=>{state.selectedDate=ds;state.viewAnchor=new Date(d);if(st==='sign'||st==='done'){state.step[ds]=5;state.review[ds]=true}go('projects')};
    b.onclick=open;b.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();open()}};
    cal.appendChild(b);
    if(i%7===6&&wl){const wsd=fmt(addDays(d,-6)),wst=weekStatus(wsd),s0=addDays(d,-6);const row=document.createElement('div');row.className='wk-row';row.innerHTML=`<button class="wk-tag st-${wst}" aria-label="Feuille de temps du ${s0.getDate()} au ${d.getDate()} ${monthNames[d.getMonth()]} — ${ST_LBL[wst]}"><b>${ST_LBL[wst]}</b></button>`;row.querySelector('button').onclick=()=>{state.sheetWeek=wsd;go('timesheet')};wl.appendChild(row)}
  }
}
function dayMenu(d){
  const ds=fmt(d),st=dayStatus(ds),lbl=`${fullDays[d.getDay()]} ${d.getDate()} ${monthNames[d.getMonth()]}`;
  const openDay=()=>{closeSheet();state.selectedDate=ds;state.viewAnchor=new Date(d);go('projects')};
  let h=`<div class="dm-st">Statut : <b>${ST_LBL[st]}</b></div><div class="dm-btns">`;
  if(st==='off')h+=`<button class="dm-btn" data-dm="restore">Rétablir la journée</button>`;
  else{h+=st==='sign'||st==='done'?`<button class="dm-btn main" data-dm="view">Visualiser</button>`:`<button class="dm-btn main" data-dm="open">${st==='vide'?'Saisir la journée':'Continuer la saisie'}</button>`;
    if(st==='vide'||st==='cours')h+=`<button class="dm-btn off" data-dm="off">Journée non travaillée</button>`}
  h+='</div>';
  openSheet(`${lbl}<span>${ST_LBL[st]}</span>`,h,body=>{
    body.querySelectorAll('[data-dm]').forEach(bt=>bt.onclick=()=>{const a=bt.dataset.dm;
      if(a==='open')openDay();
      else if(a==='view'){state.step[ds]=5;state.review[ds]=true;openDay()}
      else if(a==='off'){state.offDay[ds]=true;save();closeSheet();renderCalendar();toast('Journée non travaillée')}
      else if(a==='restore'){delete state.offDay[ds];save();closeSheet();renderCalendar();toast('Journée rétablie')}})});
}

/* feuille de temps hebdomadaire */
function renderTimesheet(){
  const el=$('#tsTable');if(!el)return;
  const ws=state.sheetWeek||fmt(startOfWeek(today));const [y,m,d0]=ws.split('-').map(Number);const start=new Date(y,m-1,d0);
  const days=[...Array(7)].map((_,i)=>addDays(start,i));const end=days[6];
  $('#tsWeek').textContent=`Semaine du ${start.getDate()} ${monthNames[start.getMonth()]} au ${end.getDate()} ${monthNames[end.getMonth()]} ${end.getFullYear()}`;
  const rows={};
  days.forEach((d,di)=>{const ds=fmt(d);projects.forEach(p=>{const key=`${ds}||${p}`,L=state.links[key],H=state.hours[key],C=state.laborCounts[key];if(!L||!C)return;
    trades.forEach(t=>{const n=C[t]||0,arr=L[t]||[];for(let i=0;i<n;i++){const name=arr[i];if(!name)continue;const r=(rows[name] ||= {name,trade:t,days:[0,0,0,0,0,0,0]});r.days[di]+=((H&&H[`${t}|${i}`])||[]).reduce((s,e)=>s+e.h,0)}})})});
  days.forEach((d,di)=>{const sh=state.supHours[fmt(d)]||{};const h=Object.values(sh).reduce((a,b)=>a+b,0);if(h){const r=(rows['Steeve Pitre'] ||= {name:'Steeve Pitre',trade:'Surintendant',days:[0,0,0,0,0,0,0]});r.days[di]+=h}});
  const list=Object.values(rows),wst=weekStatus(ws),approved=!!state.weekApproved[ws],signed=state.weekSigned[ws];
  const ab=$('#tsApprove');ab.hidden=approved||!list.length;
  $('#tsStatus').textContent=ST_LBL[wst];$('#tsStatus').className='ts-status wst-'+wst;
  if(!list.length){el.innerHTML='<div class="ts-empty">Aucune heure inscrite pour cette semaine.</div>';return}
  const groups={};list.forEach(r=>(groups[companyOf(r.name)] ||= []).push(r));
  const order=[...new Set([...state.empDb.map(e=>e.company||'Autres'),'Autres'])].filter(g=>groups[g]);
  const dayTot=[0,0,0,0,0,0,0];let grand=0;
  const head=`<tr><th class="l">Employé</th><th class="l">Métier</th>${days.map((d,i)=>`<th class="${i===0||i===6?'we':''}">${weekdays[i]}<small>${d.getDate()}</small></th>`).join('')}<th>Total</th></tr>`;
  const body=order.map(g=>`<tr class="ts-grp"><td colspan="10">${esc(g)}</td></tr>`+groups[g].sort((a,b)=>a.name.localeCompare(b.name,'fr')).map(r=>{const tot=r.days.reduce((a,b)=>a+b,0);grand+=tot;r.days.forEach((h,i)=>dayTot[i]+=h);
    return `<tr><td class="l nm">${esc(r.name)}</td><td class="l tr">${tIco(r.trade)}${r.trade}</td>${r.days.map((h,i)=>`<td class="${i===0||i===6?'we':''} ${h?'':'z'}">${h?fmtH(h):'—'}</td>`).join('')}<td class="tt">${fmtH(tot)}</td></tr>`}).join('')).join('');
  const foot=`<tr class="ts-foot"><td class="l" colspan="2">Total</td>${dayTot.map((h,i)=>`<td class="${i===0||i===6?'we':''}">${h?fmtH(h):'—'}</td>`).join('')}<td class="tt">${fmtH(grand)}</td></tr>`;
  const table=`<div class="ts-wrap ${approved?'bw':''}">${approved?`<div class="doc-stamp">Feuille de temps approuvée le ${fmtStamp(state.weekApproved[ws])}</div>`:''}<table class="ts-t"><thead>${head}</thead><tbody>${body}</tbody><tfoot>${foot}</tfoot></table></div>`;
  el.innerHTML=table+(approved?`<div class="ts-sign">${sigBlock('sigWeek',signed,'Signature du surintendant')}${signed?'':`<div class="ts-sign-btns"><button class="rv-btn modify" id="tsUnapprove">Modifier</button><button class="rv-btn approve" id="tsComplete">Compléter</button></div>`}</div>`:'');
  const cb=$('#tsComplete');if(cb)cb.onclick=()=>{const sig=readSig('sigWeek');if(!sig){toast('Signer avant de compléter');return}state.weekSigned[ws]={sig,at:Date.now()};save();renderTimesheet();renderCalendar();toast('Feuille de temps complétée')};
  const ub=$('#tsUnapprove');if(ub)ub.onclick=()=>{delete state.weekApproved[ws];save();renderTimesheet();renderCalendar()};
  mountSigs();
}
$('#tsApprove').onclick=()=>{const ws=state.sheetWeek;state.weekApproved[ws]=Date.now();save();flash();setTimeout(()=>{renderTimesheet();renderCalendar()},180)};
function renderAll(){
  if(!['calendar','projects','hours','timesheet','manage'].includes(state.currentPage))state.currentPage='calendar';
  renderCalendar();renderProjects();renderHours();renderTimesheet();renderManage();
  ['calendarPage','projectsPage','hoursPage','timesheetPage','managePage'].forEach(id=>$('#'+id).classList.remove('active'));
  $('#'+state.currentPage+'Page').classList.add('active');

  $('#app').classList.toggle('mid',state.currentPage==='calendar'||state.currentPage==='timesheet'||state.currentPage==='manage');fitIpad();mountSigs();

function syncOffBtn(){const b=$('#offBtn');if(!b)return;const off=!!state.offDay[state.selectedDate],st=dayStatus(state.selectedDate);b.textContent=off?'Rétablir la journée':'Journée non travaillée';b.classList.toggle('on',off);b.hidden=st==='sign'||st==='done'}

<script>
window.__fit=function(){const el=document.getElementById('ipad'),app=document.getElementById('app'),fdt=app&&!document.querySelector('.stage');if(!el&&!app)return;
  const cs=getComputedStyle(document.getElementById('safeProbe'));
  const L=parseFloat(cs.paddingLeft)||0,R=parseFloat(cs.paddingRight)||0,T=parseFloat(cs.paddingTop)||0,B=parseFloat(cs.paddingBottom)||0;
  const phone=Math.min(innerWidth,innerHeight)<600;document.documentElement.classList.toggle('phone',phone);
  const m=phone?0:8,s=Math.min(1,(innerWidth-L-R-m)/1180,(innerHeight-T-B-m)/820);
  if(fdt){
    if(phone){Object.assign(app.style,{width:'1180px',height:'820px',maxWidth:'none',minHeight:'0',padding:'0',overflow:'auto',zoom:s});if(el)el.style.zoom=1}
